name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & package
        run: |
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Build Docker Images for Testing
        run: |
          # Build your proxy / sandbox images so they exist locally in CI
          docker build -t inspect-auditor-proxy:latest -f src/inspect_docker_auditor/Dockerfile.agent .
          docker build -t inspect-auditor-proxy:latest -f src/inspect_docker_auditor/Dockerfile.proxy .

      - name: Run Pytest with Container Log Dumping on Failure
        run: pytest -v

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          docker logs test_mitmproxy || true
          docker logs test_socket_proxy || true
